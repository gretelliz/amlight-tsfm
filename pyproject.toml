[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amlight-tsfm"
version = "0.1.0"
description = "A Multi-Task Benchmark for Time Series Foundation Models on R&E Backbone Telemetry (INDIS'26)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "joblib>=1.3",
    "torch>=2.1",
    "transformers>=4.40,<5.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "einops>=0.7",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
timesfm = ["timesfm[torch]==1.3.0"]
chronos = ["chronos-forecasting>=1.3"]
moirai = ["uni2ts>=1.1"]
ttm = ["granite-tsfm @ git+https://github.com/ibm-granite/granite-tsfm.git"]
classical = ["statsmodels>=0.14", "prophet>=1.1"]
dev = ["pytest>=7.4", "black>=23.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "tasks*", "evaluation*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py311"
